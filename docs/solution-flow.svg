<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">IPSpaceClaim solution flow</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#6b7280">What happens when a platform team applies a claim</text>

  <!-- Box 1: kubectl apply -->
  <rect x="40" y="150" width="250" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="165" y="182" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E3A8A">kubectl apply -f</text>
  <text x="165" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E3A8A">IPSpaceClaim (CRD)</text>
  <text x="165" y="222" text-anchor="middle" font-size="10.5" fill="#3B82F6">Platform engineer declares intent</text>
  <text x="165" y="237" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#3B82F6">cidrSize: 28</text>

  <!-- Arrow 1: watch -->
  <line x1="290" y1="200" x2="418" y2="200" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="354" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">watch</text>

  <!-- Box 2: Controller -->
  <rect x="420" y="150" width="270" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="555" y="182" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E3A8A">IPSpaceClaim Controller</text>
  <text x="555" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E3A8A">(controller-runtime)</text>
  <text x="555" y="222" text-anchor="middle" font-size="10.5" fill="#3B82F6">Reconciles desired vs. actual state</text>
  <text x="555" y="237" text-anchor="middle" font-size="10.5" fill="#3B82F6">writes .status back to the CRD</text>

  <!-- Arrow 2: allocate/get/release, vertical down -->
  <line x1="555" y1="250" x2="555" y2="318" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="565" y="264" width="270" height="42" rx="6" fill="#ffffff" stroke="#374151" stroke-dasharray="3 3"/>
  <text x="700" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">allocate / get / release</text>
  <text x="700" y="296" text-anchor="middle" font-size="10.5" fill="#6b7280">REST (DDI v1)</text>

  <!-- Box 3: Infoblox Universal DDI -->
  <rect x="380" y="320" width="350" height="80" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="555" y="350" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350F">Infoblox Universal DDI</text>
  <text x="555" y="372" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#92400E">/api/ddi/v1/ipam/address_block</text>
  <text x="555" y="390" text-anchor="middle" font-size="10" fill="#92400E">System of record for the allocation</text>

</svg>
