apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dnsrecordclaims.infoblox.udaykishore.dev
spec:
  group: infoblox.udaykishore.dev
  names:
    kind: DNSRecordClaim
    listKind: DNSRecordClaimList
    plural: dnsrecordclaims
    singular: dnsrecordclaim
    shortNames: ["drc"]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Zone
          type: string
          jsonPath: .spec.zone
        - name: FQDN
          type: string
          jsonPath: .status.fqdn
        - name: Type
          type: string
          jsonPath: .spec.recordType
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["zone", "name", "recordType", "value"]
              properties:
                zone:
                  type: string
                  description: DNS zone this record belongs to, e.g. example.com.
                name:
                  type: string
                  description: Hostname within the zone, or "@" for the zone apex.
                recordType:
                  type: string
                  enum: ["A", "CNAME", "TXT"]
                value:
                  type: string
                  description: Record target — an IP for A, a hostname for CNAME, free text for TXT.
                ttl:
                  type: integer
                  default: 300
                tags:
                  type: object
                  additionalProperties:
                    type: string
                reclaimPolicy:
                  type: string
                  enum: ["Release", "Retain"]
                  default: "Release"
            status:
              type: object
              properties:
                phase:
                  type: string
                fqdn:
                  type: string
                infobloxRef:
                  type: string
                lastReconciledGeneration:
                  type: integer
                lastDriftCheckTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                      observedGeneration: {type: integer}
