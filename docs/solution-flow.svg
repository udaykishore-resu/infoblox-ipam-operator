<svg viewBox="0 0 940 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="480" fill="#ffffff"/>

  <text x="470" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Solution flow — two CRDs, one manager</text>
  <text x="470" y="54" text-anchor="middle" font-size="12" fill="#6b7280">What happens when a platform team applies a claim of either kind</text>

  <!-- Box 1a: kubectl apply IPSpaceClaim -->
  <rect x="30" y="90" width="270" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="165" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E3A8A">kubectl apply -f</text>
  <text x="165" y="136" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E3A8A">IPSpaceClaim (CRD)</text>
  <text x="165" y="156" text-anchor="middle" font-size="10" fill="#3B82F6">cidrSize: 28 — IPAM</text>

  <!-- Box 1b: kubectl apply DNSRecordClaim -->
  <rect x="30" y="290" width="270" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="165" y="318" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E3A8A">kubectl apply -f</text>
  <text x="165" y="336" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E3A8A">DNSRecordClaim (CRD)</text>
  <text x="165" y="356" text-anchor="middle" font-size="10" fill="#3B82F6">recordType: A — DNS</text>

  <!-- Arrows converging into controller manager -->
  <path d="M300,135 L370,135 L370,215 L400,215" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">watch</text>

  <path d="M300,335 L370,335 L370,255 L400,255" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="349" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">watch</text>

  <!-- Box 2: Controller manager, single box holding both reconcilers -->
  <rect x="400" y="175" width="300" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="550" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Controller manager</text>
  <text x="550" y="219" text-anchor="middle" font-size="10.5" fill="#1E3A8A">(controller-runtime, one process)</text>
  <rect x="418" y="230" width="264" height="26" rx="5" fill="#ffffff" stroke="#93C5FD"/>
  <text x="550" y="248" text-anchor="middle" font-size="10" font-family="monospace" fill="#1E3A8A">IPSpaceClaimReconciler</text>
  <rect x="418" y="260" width="264" height="26" rx="5" fill="#ffffff" stroke="#93C5FD"/>
  <text x="550" y="278" text-anchor="middle" font-size="10" font-family="monospace" fill="#1E3A8A">DNSRecordClaimReconciler</text>

  <!-- Arrow down to Infoblox -->
  <line x1="550" y1="295" x2="550" y2="363" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="308" width="300" height="46" rx="6" fill="#ffffff" stroke="#374151" stroke-dasharray="3 3"/>
  <text x="710" y="324" text-anchor="middle" font-size="10.5" font-weight="600" fill="#374151">IPAM: allocate / get / release</text>
  <text x="710" y="340" text-anchor="middle" font-size="10.5" font-weight="600" fill="#374151">DNS: create / get / delete record</text>

  <!-- Box 3: Infoblox Universal DDI -->
  <rect x="375" y="365" width="350" height="90" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="550" y="393" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350F">Infoblox Universal DDI</text>
  <text x="550" y="414" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#92400E">/api/ddi/v1/ipam/... · /api/ddi/v1/dns/record</text>
  <text x="550" y="432" text-anchor="middle" font-size="9.5" fill="#92400E">System of record for both allocation types</text>

</svg>
